    :root{
      --bg:#ffffff;
      --card:#ffffff;

      /* TEXT COLORS (ALL BLUES) */
      --text:#0f2a44;
      --muted:#4b6b8a;

      /* LINKS & ACCENTS */
      --accent:#1d4ed8;
      --accent2:#60a5fa;

      --line:rgba(15,42,68,.15);
      --shadow: 0 10px 30px rgba(15,42,68,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color:var(--text);
      line-height:1.6;
    }

    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}

    header{
      padding: 56px 18px 18px;
      max-width: 1050px;
      margin: 0 auto;
    }

    .kicker{
      display:inline-flex;
      gap:10px;
      align-items:center;
      border:1px solid var(--line);
      background: rgba(29,78,216,.05);
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
    }

    .dot{
      width:10px;height:10px;border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 0 4px rgba(29,78,216,.15);
    }

    h1{
      font-size: clamp(34px, 4vw, 52px);
      line-height:1.1;
      margin: 18px 0 12px;
      letter-spacing:-0.02em;
      color:#0b2540;
    }

    h2, h3{
      color:#0b2540;
    }

    .subtitle{
      max-width: 70ch;
      color: var(--muted);
      font-size: 18px;
      margin: 0 0 22px;
    }

    .grid{
      max-width:1050px;
      margin: 0 auto;
      padding: 18px;
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }

    @media (max-width: 900px){
      .grid{grid-template-columns:1fr}
    }

    .card{
      background: var(--card);
      border:1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .card .inner{padding:18px}

    .muted{color:var(--muted)}

    .list{
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
    }

    .list li{margin: 6px 0}

    .tagrow{
      display:flex; flex-wrap:wrap; gap:10px;
      margin-top: 12px;
    }

    .tag{
      padding: 7px 10px;
      border:1px solid rgba(29,78,216,.25);
      background: rgba(59,130,246,.08);
      border-radius: 999px;
      font-size: 13px;
      color:#1e40af;
    }

    .toc a{
      display:block;
      padding: 8px 0;
      border-bottom:1px dashed rgba(15,42,68,.2);
    }

    .toc a:last-child{border-bottom:none}

    .callout{
      border-left: 4px solid var(--accent);
      background: rgba(59,130,246,.08);
      padding: 12px 14px;
      border-radius: 12px;
      margin-top: 12px;
      color: var(--muted);
    }

    .two-col{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 12px;
    }

    @media (max-width: 600px){
      .two-col{grid-template-columns:1fr}
    }

    .mini{
      background: rgba(59,130,246,.05);
      border:1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }

    .mini h3{margin:0 0 6px; font-size: 16px}

    .quote{
      font-style: italic;
      color: var(--muted);
      border-left: 3px solid rgba(96,165,250,.7);
      padding-left: 12px;
      margin: 12px 0;
    }
